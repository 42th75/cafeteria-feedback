<!DOCTYPE html>
<html lang="ko">
<head>

  <title>급식 피드백</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>오늘의 급식</h1>

    <!-- 날짜 선택 UI -->

      <button id="nextBtn">▷</button>

    <!-- 급식 메뉴 카드가 여기에 JS로 채워짐 -->
    <div id="menuList"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
