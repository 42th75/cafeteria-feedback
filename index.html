<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>급식 피드백</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">

    <!-- 탭 메뉴 -->
    <div class="tab-bar">
      <button class="tab active" data-tab="mealTab">오늘의 급식</button>
      <button class="tab" data-tab="rankTab">선호도 · 행사</button>
      <button class="tab" data-tab="adminTab">영양사</button>
    </div>

    <!-- 화면 1: 오늘의 급식 (2~3차시) -->
    <section id="mealTab" class="tab-page">
      <h1 class="title">오늘의 급식</h1>
      <div class="date-bar">
        <button id="prevBtn">&lt;</button>
        <span id="dateText">날짜</span>
        <button id="nextBtn">&gt;</button>
      </div>
      <div id="menuList"></div>
    </section>

    <!-- 화면 2: 선호도 랭킹 + 행사 게시판 (4차시) -->
    <section id="rankTab" class="tab-page hidden">
      <h1 class="title">메뉴 선호도 및 행사 정보</h1>

      <div class="rank-wrap">
        <div class="rank-box">
          <h3>🏆 TOP 5 인기 급식</h3>
          <ol id="topList" class="rank-list"></ol>
        </div>
        <div class="rank-box">
          <h3>👎 비선호 메뉴</h3>
          <ol id="bottomList" class="rank-list"></ol>
        </div>
      </div>

      <div class="event-head">
        <h3>📢 급식 행사</h3>
        <select id="sortSelect">
          <option value="latest">최신순</option>
          <option value="popular">인기순</option>
        </select>
      </div>
      <div id="eventList"></div>
    </section>

    <!-- 화면 3: 영양사 대시보드 (5차시) -->
    <section id="adminTab" class="tab-page hidden">
      <h1 class="title">영양사 통계 & 행사 관리</h1>

      <div class="report-wrap">
        <div class="report-box">
          <div class="report-label">👍 최고 선호 메뉴</div>
          <div id="bestMenu" class="report-value">-</div>
        </div>
        <div class="report-box">
          <div class="report-label">👎 최저 선호 메뉴</div>
          <div id="worstMenu" class="report-value">-</div>
        </div>
      </div>

      <div class="admin-box">
        <h3>📊 메뉴별 평균 별점</h3>
        <div class="chart-wrap">
          <canvas id="menuChart"></canvas>
        </div>
      </div>

      <div class="admin-box">
        <h3>📢 행사 반응</h3>
        <table class="event-table">
          <thead>
            <tr><th>행사</th><th>조회</th><th>좋아요</th></tr>
          </thead>
          <tbody id="eventStats"></tbody>
        </table>
      </div>

      <div class="admin-box">
        <h3>✏️ 행사 등록</h3>
        <input id="evTitle" class="admin-input" type="text" placeholder="제목" maxlength="30">
        <input id="evPeriod" class="admin-input" type="text" placeholder="기간 (예: ~ 11월 15일)" maxlength="20">
        <textarea id="evContent" class="admin-input" rows="3" placeholder="내용" maxlength="1000"></textarea>
        <button id="evSubmit" class="submit-btn full">공지 등록하기</button>
      </div>
    </section>

  </div>

  <!-- Chart.js와 supabase-js는 반드시 main.js보다 먼저 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="main.js"></script>
</body>
</html>
